name: Graded prices

on:
  schedule:
    - cron: "17 15 5 * *"   # monthly, on the 5th (the PSA CardFacts mirror refreshes around the 1st)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-prices
  cancel-in-progress: false

jobs:
  graded:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build graded prices
        run: python scripts/graded_prices.py
      - name: Save to repo
        run: |
          git config user.name "chasedeck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices/_graded.json prices/_graded_hist.json
          if git diff --cached --quiet; then
            echo "No graded changes"
          else
            git commit -m "Graded prices $(date -u +%F)"
            git pull --rebase
            git push
          fi
