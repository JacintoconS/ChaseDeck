name: Record prices

on:
  schedule:
    - cron: "37 21 * * *"   # every day around 3:37 PM Central, after tcgcsv.com updates (~20:00 UTC)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: record-prices
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Record today's prices
        run: python scripts/record_prices.py
      - name: Save to repo
        run: |
          git config user.name "chasedeck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "Record prices $(date -u +%F)"
            git pull --rebase
            git push
          fi
